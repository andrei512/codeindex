[package]
name = "codeindex"
version = "0.2.0"
edition = "2024"
description = "Local code and Markdown search for coding agents, with a zero-setup cx CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/andrei512/codeindex"
documentation = "https://docs.rs/codeindex"
rust-version = "1.95"
keywords = ["code-search", "indexing", "cli", "bm25", "markdown"]
categories = ["command-line-utilities", "development-tools"]
include = ["/Cargo.toml", "/Cargo.lock", "/build.rs", "/src/**", "/tests/**", "/benches/content.rs", "/README.md", "/LICENSE"]

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]

[[bench]]
name = "content"
harness = false
